[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "suno-mcp"
version = "0.1.0"
description = "A FastMCP server that interacts with Suno using Playwright for music generation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=3.2.0",
    "playwright>=1.40.0",
]

[project.scripts]
suno-mcp = "suno_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/suno_mcp"]

[tool.ruff]
line-length = 100
