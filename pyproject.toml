[project]
name = "suno-mcp"
version = "0.1.0"
description = "MCP server for Suno AI music generation"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Giovanni Lion", email = "giovanni.lion@gmail.com" }]

dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suno_mcp"]
