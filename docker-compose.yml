services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: suno-mcp
    restart: unless-stopped
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:?TS_AUTHKEY is required}
      - TS_EXTRA_ARGS=--advertise-tags=tag:container
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
    volumes:
      - /home/venetanji/dev/suno-mcp/serve.json:/config/serve.json
      - tailscale-data:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    ports:
      - "6080:6080"

  suno-mcp:
    build: .
    network_mode: service:tailscale
    restart: unless-stopped
    depends_on:
      - tailscale
    volumes:
      - ./downloads:/downloads
      - ./data:/data
      - ./src:/app/src
    environment:
      - SUNO_DOWNLOAD_DIR=/downloads
      - SUNO_AUTH_DIR=/data
      - SUNO_HOST=0.0.0.0
      - SUNO_PORT=8085

volumes:
  tailscale-data:
