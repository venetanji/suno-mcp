[supervisord]
nodaemon=false
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:xvfb]
command=Xvfb :99 -screen 0 1280x900x24 -ac
autorestart=true
priority=10

[program:x11vnc]
command=x11vnc -display :99 -forever -nopw -shared -rfbport 5900
autorestart=true
priority=20

[program:openbox]
command=/start-openbox.sh
environment=DISPLAY=":99"
autorestart=true
priority=25
startretries=5

[program:novnc]
command=websockify --web /usr/share/novnc 6081 localhost:5900
autorestart=true
priority=30
